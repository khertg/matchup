# Production stack for a single server:  Caddy (HTTPS, web app, /api proxy) + API + Postgres.
# Only Caddy is reachable from the internet. See deploy/README.md.
#
#   cd deploy && cp .env.example .env    # then edit .env
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - caddy_data:/data # certificates: keep this volume, or Let's Encrypt limits will bite
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, internal]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: prod
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-matchup}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-matchup}
      TRUST_PROXY: "true" # the real client address arrives from Caddy, so rate limits are per person
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matchup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-matchup}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal] # no published port: only the API can reach the database

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
    internal: true # no route to the internet, so the database and API cannot be reached from outside
