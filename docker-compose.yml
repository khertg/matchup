services:
  # Hot-reload dev server: `docker compose up dev` -> http://localhost:5173
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # keep container deps, not the host's

  # Production image behind nginx: `docker compose --profile prod up --build web` -> http://localhost:8080
  web:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        # Set in .env.local and pass with: docker compose --env-file .env.local ...
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:80"

volumes:
  node_modules:
