# Development stack: the web app, the API, a Postgres database and Adminer to browse it.
#   docker compose up            -> web http://localhost:5173, API http://localhost:8787, Adminer http://localhost:8080
# Production lives in deploy/docker-compose.prod.yml.
services:
  # Hot-reload web app. /api is proxied to the api service, as it will be behind the reverse proxy.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://api:8787
    depends_on:
      - api
    volumes:
      - .:/app
      - node_modules:/app/node_modules # keep container deps, not the host's
      - web_node_modules:/app/apps/web/node_modules

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgres://matchup:matchup@db:5432/matchup
      PORT: "8787"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules

  # The dev database. Port 5432 is published (on this machine only) so you can inspect it with a SQL client.
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: matchup
      POSTGRES_PASSWORD: matchup
      POSTGRES_DB: matchup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchup -d matchup"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Web UI for the dev database (http://localhost:8080). Log in with System PostgreSQL,
  # server db, user/password/database matchup. Dev only: it is not part of the production stack.
  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  node_modules:
  web_node_modules:
  api_node_modules:
  pgdata:
